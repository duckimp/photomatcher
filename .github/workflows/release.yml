name: Release PhotoMatcher.id Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (64-bit)
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            rust-targets: 'x86_64-pc-windows-msvc'

          # Windows x86 (32-bit)
          - platform: 'windows-latest'
            args: '--target i686-pc-windows-msvc'
            rust-targets: 'i686-pc-windows-msvc'

          # Linux x64 (.deb & .AppImage)
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            rust-targets: 'x86_64-unknown-linux-gnu'

          # macOS Universal (.dmg) — harus install kedua target, bukan universal-apple-darwin
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install the actual Rust target triples (bukan "universal-apple-darwin")
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PhotoMatcher.id ${{ github.ref_name }}'
          releaseBody: |
            ## 📸 PhotoMatcher.id Desktop Release
            
            Multi-platform desktop build by AM-Lab.
            
            ### 📥 Download Installer:
            - **Windows 64-bit (.exe / .msi)**: `PhotoMatcher.id_*_x64-setup.exe`
            - **Windows 32-bit (.exe)**: `PhotoMatcher.id_*_x86-setup.exe`
            - **Linux (.deb)**: `photomatcher-id_*_amd64.deb`
            - **macOS Universal (.dmg)**: `PhotoMatcher.id_*_universal.dmg`
            
            *100% Client-Side Safe, Memory-First Architecture.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
